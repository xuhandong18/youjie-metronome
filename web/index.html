<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff4f8">
  <meta name="color-scheme" content="light">
  <meta name="description" content="自由设置动作节拍、次数和换气间隔，手机和平板均可单屏操控，离线中文播报。">
  <title>有节 · 动作节拍器</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23713f58'/%3E%3Cpath d='M17 38V27m10 20V17m10 25V22m10 14V28' stroke='%23ffc2dc' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <svg class="sr-only" aria-hidden="true"><defs>
    <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 20V4m-6 6 6-6 6 6"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="M12 4v16m-6-6 6 6 6-6"/></symbol>
    <symbol id="i-heart" viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="m9 5 11 7-11 7Z" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14" stroke-width="3"/></symbol>
    <symbol id="i-reset" viewBox="0 0 24 24"><path d="M4 10a8 8 0 1 1 1 7M4 4v6h6"/></symbol>
    <symbol id="i-volume" viewBox="0 0 24 24"><path d="m11 5-6 4H2v6h3l6 4Zm4 3a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/></symbol>
    <symbol id="i-focus" viewBox="0 0 24 24"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3" fill="currentColor" stroke="none"/><circle cx="15" cy="17" r="3" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
  </defs></svg>
  <div class="shell" id="appShell" data-layout="compact">
    <header class="topbar">
      <div class="brand"><div class="brand-mark" aria-hidden="true"><svg viewBox="0 0 28 28"><path d="M5 17v-6m6 13V4m6 16V8m6 8v-4"/></svg></div><span class="brand-name">有节</span><span class="brand-sub">动作节拍器</span></div>
      <div class="top-actions"><button class="settings-button" id="settingsButton" aria-expanded="false" aria-controls="settings"><svg aria-hidden="true"><use href="#i-settings"/></svg><span>设置</span></button><button class="focus-button" id="focusButton" aria-pressed="false"><svg aria-hidden="true"><use href="#i-focus"/></svg><span>专注模式</span></button></div>
    </header>
    <main class="workspace">
      <aside class="settings" id="settings" aria-label="训练设置" tabindex="-1">
        <div class="section-title"><h2>节拍设置</h2><button type="button" class="close-settings" id="closeSettings" aria-label="关闭设置">×</button></div>
        <fieldset id="configFields"><legend class="sr-only">节拍与次数</legend><div class="config-inner">
          <span class="field-label">动作时长</span>
          <div class="phase-setting"><label class="phase-caption" for="upSeconds"><span class="phase-symbol"><svg aria-hidden="true"><use href="#i-up"/></svg></span>上</label><div class="stepper"><button type="button" data-input="upSeconds" data-step="-0.5" aria-label="减少上的时长">−</button><input id="upSeconds" type="number" min="0.1" max="120" step="0.1" value="1" inputmode="decimal" aria-label="上的时长，秒"><span class="unit">秒</span><button type="button" data-input="upSeconds" data-step="0.5" aria-label="增加上的时长">+</button></div></div>
          <div class="phase-setting"><label class="phase-caption" for="downSeconds"><span class="phase-symbol down"><svg aria-hidden="true"><use href="#i-down"/></svg></span>下</label><div class="stepper"><button type="button" data-input="downSeconds" data-step="-0.5" aria-label="减少下的时长">−</button><input id="downSeconds" type="number" min="0.1" max="120" step="0.1" value="5" inputmode="decimal" aria-label="下的时长，秒"><span class="unit">秒</span><button type="button" data-input="downSeconds" data-step="0.5" aria-label="增加下的时长">+</button></div></div>
          <div class="presets" aria-label="快捷节拍"><button class="preset active" type="button" data-up="1" data-down="5" aria-pressed="true">1 秒上 · 5 秒下</button><button class="preset" type="button" data-up="2" data-down="2" aria-pressed="false">2 秒上 · 2 秒下</button><button class="preset" type="button" data-up="3" data-down="3" aria-pressed="false">3 秒上 · 3 秒下</button></div>
          <div class="order-setting"><span class="field-label">动作顺序</span><div class="order-options" role="group" aria-label="动作顺序"><button type="button" class="order-option active" data-order="up-down" aria-pressed="true">先上 ↑ 再下 ↓</button><button type="button" class="order-option" data-order="down-up" aria-pressed="false">先下 ↓ 再上 ↑</button></div></div>
          <div class="divider"></div>
          <div class="rep-row"><div class="rep-copy"><label for="repetitions">本组次数</label><p>完成一次上 + 下，计为 1 次</p></div><div class="stepper"><button type="button" data-input="repetitions" data-step="-1" aria-label="减少次数">−</button><input id="repetitions" type="number" min="1" max="999" step="1" value="20" inputmode="numeric" aria-label="本组次数"><span class="unit">次</span><button type="button" data-input="repetitions" data-step="1" aria-label="增加次数">+</button></div></div>
          <div class="rep-row breath-setting"><div class="rep-copy"><label for="breathSeconds">次间换气</label><p>0 秒关闭，最后一次不等待</p></div><div class="stepper"><button type="button" data-input="breathSeconds" data-step="-0.5" aria-label="减少换气时间">−</button><input id="breathSeconds" type="number" min="0" max="120" step="0.1" value="2" inputmode="decimal" aria-label="每次之间的换气时间，秒"><span class="unit">秒</span><button type="button" data-input="breathSeconds" data-step="0.5" aria-label="增加换气时间">+</button></div></div>
          <div class="rep-row breath-setting"><div class="rep-copy"><label for="breathEvery">换气间隔</label><p>每完成几次完整动作后换气</p></div><div class="stepper"><button type="button" data-input="breathEvery" data-step="-1" aria-label="减少换气间隔">−</button><input id="breathEvery" type="number" min="1" max="999" step="1" value="1" inputmode="numeric" aria-label="每完成多少次动作后换气"><span class="unit">次</span><button type="button" data-input="breathEvery" data-step="1" aria-label="增加换气间隔">+</button></div></div>
          <div class="prep-row"><label for="prep"><input id="prep" type="checkbox" class="switch" checked>开始前准备 3 秒</label><small>从容就位</small></div>
        </div></fieldset>
        <div class="screen-control"><label for="keepScreenOn"><input id="keepScreenOn" class="switch" type="checkbox" checked>训练时保持亮屏</label><span class="screen-state" id="screenState" data-active="false" role="status">训练时开启</span></div>
        <div class="divider"></div>
        <div class="sound-heading"><label for="volume">中文语音 · 每秒一拍</label><span id="volumeValue">100%</span></div>
        <div class="volume"><svg aria-hidden="true"><use href="#i-volume"/></svg><input id="volume" type="range" min="0" max="100" value="100" aria-label="提示音音量"></div>
        <div class="sound-tests" aria-label="试听提示音"><button class="sound-test" data-sound="up"><svg aria-hidden="true"><use href="#i-up"/></svg>试听上</button><button class="sound-test" data-sound="down"><svg aria-hidden="true"><use href="#i-down"/></svg>试听下</button><button class="sound-test" data-sound="finish"><svg aria-hidden="true"><use href="#i-check"/></svg>试听结束</button></div>
        <p class="settings-foot">超过 3 秒：先报动作，再按秒倒数<br>换气时播报「换气」，结束播报「完成」</p>
        <div class="summary"><span><svg aria-hidden="true"><use href="#i-clock"/></svg>每次动作 <strong id="cycleSummary">6 秒</strong></span><i class="summary-dot"></i><span>次间换气 <strong id="breathSummary">2 秒</strong></span><i class="summary-dot"></i><span>共 <strong id="repSummary">20 次</strong></span><i class="summary-dot"></i><span>预计 <strong id="durationSummary">2 分 38 秒</strong><span id="prepSummary"> + 3 秒准备</span></span></div>
      </aside>
      <button class="settings-backdrop" id="settingsBackdrop" type="button" aria-label="关闭设置面板" tabindex="-1" hidden></button>
      <section class="stage" id="stage" data-mode="idle" data-phase="up" aria-label="训练计时器">
        <div class="stage-head"><span class="stage-title">本组训练</span><span class="status-badge"><i class="status-dot"></i><span id="statusLabel" role="status">等待开始</span></span></div>
        <div class="stage-statistics"><div><div class="stat-label">已完成 / 目标</div><div class="stat-value"><span id="completed">00</span><span class="stat-small">/ <span id="target">20</span> 次</span></div></div><div class="stat-right"><div class="stat-label">本组剩余</div><div class="stat-value" id="remaining">02:00</div></div></div>
        <div class="dial-zone" id="dialZone">
        <div class="timer" aria-hidden="true"><svg class="timer-ring" viewBox="0 0 302 302"><circle class="ring-track" cx="151" cy="151" r="148"/><circle class="ring-ticks" cx="151" cy="151" r="141"/><circle class="ring-progress" id="ring" cx="151" cy="151" r="130" stroke-dasharray="816.814" stroke-dashoffset="0"/></svg><div class="timer-inner"><div class="direction"><svg><use id="directionIcon" href="#i-up"/></svg></div><div class="phase-name" id="phaseName">准备</div><div class="countdown" id="countdown">1.0</div><div class="timer-unit" id="timerUnit">秒 / 上的时长</div></div></div>
        </div>
        <div class="next-phase" id="nextPhase" aria-live="polite">从「上」开始，找到自己的节奏</div>
        <div class="pace-guide">
        <div class="phase-track" aria-hidden="true"><div id="upTrack" style="flex:1"><i id="upFill"></i></div><div class="down" id="downTrack" style="flex:5"><i id="downFill"></i></div></div>
        <div class="track-labels"><span id="upLegend"><i class="legend-dot"></i>上 <b id="upLabel">1</b> 秒</span><span id="downLegend"><i class="legend-dot blue"></i>下 <b id="downLabel">5</b> 秒</span></div>
        </div>
        <div class="controls"><button class="primary-button" id="primaryButton"><svg aria-hidden="true"><use id="buttonIcon" href="#i-play"/></svg><span id="buttonText">开始这一组</span></button><button class="reset-button" id="resetButton" aria-label="重置本组训练" title="重置（R）"><svg aria-hidden="true"><use href="#i-reset"/></svg></button></div>
        <p class="notice" id="notice" role="status"></p>
      </section>
    </main>
  </div>
  <script src="capacitor.js"></script>

      const phase = done ? '完成' : idle ? '准备' : point.kind === 'prep' ? '就位' : point.kind === 'breath' ? '换气' : point.kind === 'up' ? '上' : point.kind === 'down' ? '下' : '完成';
      setText('phaseName', phase);
      setText('countdown', done ? pad(config.reps) : point.remaining.toFixed(1));
      setText('timerUnit', done ? '次 / 本组已完成' : idle ? `秒 / ${firstName}的时长` : point.kind === 'prep' ? '秒 / 准备开始' : paused ? '秒 / 已暂停' : point.kind === 'breath' ? '秒 / 放松换气' : '秒 / 当前动作');
      const icon = done ? 'check' : point.kind === 'breath' ? 'heart' : point.kind === 'down' ? 'down' : point.kind === 'prep' ? 'clock' : 'up';
      $('directionIcon').setAttribute('href', `#i-${icon}`);
      $('ring').style.strokeDashoffset = String(816.814 * (done ? 0 : clamp(point.progress, 0, 1)));
      $('upFill').style.width = `${clamp(point.up, 0, 1) * 100}%`; $('downFill').style.width = `${clamp(point.down, 0, 1) * 100}%`;
      setText('completed', pad(point.completed)); setText('remaining', clock(idle ? config.exercise : config.total - elapsed));
      let next = `从「${firstName}」开始，找到自己的节奏`;
      if (done) next = `这一组 ${config.reps} 次，完成。休息一下吧。`;
      else if (!idle) {
        if (point.kind === 'prep') next = `即将开始 · ${firstName} ${short(config[firstKind])} 秒`;
        else if (point.kind === 'breath') next = `已完成 ${point.completed} / ${config.reps} 次 · 换气后，从「${firstName}」开始`;
        else {
          const nextKind = config.phases[1], nextName = nextKind === 'up' ? '上' : '下';
          const upcoming = point.kind === firstKind ? `${nextName} ${short(config[nextKind])} 秒` : point.completed + 1 === config.reps ? '本组完成' : config.breath && (point.completed + 1) % config.breathEvery === 0 ? `换气 ${short(config.breath)} 秒` : `${firstName} ${short(config[firstKind])} 秒`;
          next = `第 ${point.completed + 1} / ${config.reps} 次 · 接下来：${upcoming}`;
        }
      }
      setText('nextPhase', next);
      setText('statusLabel', ({ idle: '等待开始', starting: '开启声音中', running: point.kind === 'prep' ? '准备开始' : point.kind === 'breath' ? '换气一下' : '跟随节奏', paused: '已暂停', done: '本组已完成' })[state.mode]);
      setText('buttonText', ({ idle: '开始这一组', starting: '正在准备', running: '暂停一下', paused: '继续这一组', done: '再来一组' })[state.mode]);
      $('buttonIcon').setAttribute('href', state.mode === 'running' ? '#i-pause' : '#i-play');
      $('primaryButton').disabled = state.mode === 'starting';
      const locked = ['running', 'paused', 'starting'].includes(state.mode);
      $('configFields').disabled = locked;
      document.querySelectorAll('.sound-test').forEach(button => { button.disabled = locked; });
    }
    async function acquireWakeLock() {
      if (!$('keepScreenOn').checked || document.hidden || state.mode !== 'running') return;
      const request = ++screenRequest;
      if (nativeScreen) {
        setText('screenState', '正在开启');
        try {
          const result = await nativeScreen.setTrainingState({ running: true, enabled: true });
          if (request !== screenRequest) return;
          $('screenState').dataset.active = String(result.active);
          setText('screenState', result.active ? '已保持亮屏' : '未能保持亮屏');
        } catch (_) { if (request === screenRequest) { $('screenState').dataset.active = 'false'; setText('screenState', '开启失败，可重试'); } }
        return;
      }
      if (wakeLock || wakePending) return;
      if (!navigator.wakeLock) { setText('screenState', '浏览器暂不支持'); return; }
      wakePending = true;
      try {
        const lock = await navigator.wakeLock.request('screen');
        if (request !== screenRequest || state.mode !== 'running' || !$('keepScreenOn').checked) await lock.release();
        else {
          wakeLock = lock; $('screenState').dataset.active = 'true'; setText('screenState', '已保持亮屏');
          lock.addEventListener('release', () => { if (wakeLock === lock) { wakeLock = null; $('screenState').dataset.active = 'false'; setText('screenState', state.mode === 'running' ? '亮屏已解除' : '训练时开启'); } });
        }
      } catch (_) { if (request === screenRequest) setText('screenState', '未能保持亮屏'); } finally { wakePending = false; }
    }
    function releaseWakeLock() {
      ++screenRequest;
      const lock = wakeLock; wakeLock = null;
      if (lock) lock.release().catch(() => {});
      if (nativeScreen) nativeScreen.setTrainingState({ running: false, enabled: $('keepScreenOn').checked }).catch(() => {});
      $('screenState').dataset.active = 'false';
      setText('screenState', $('keepScreenOn').checked ? '训练时开启' : '已关闭');
    }
    function stopLoop() { clearInterval(state.interval); state.interval = null; }
    function finish() { stopLoop(); state.elapsed = config.total; state.mode = 'done'; releaseWakeLock(); render(); }
    function tick() {
      if (state.mode !== 'running') return;
      const elapsed = elapsedNow();
      while (state.nextCue < state.cues.length && state.cues[state.nextCue].time <= elapsed + 0.22) {
        const cue = state.cues[state.nextCue++];
        if (cue.time >= elapsed - 0.12 || cue.kind === 'finish') sound(cue.kind, Math.max(audio.currentTime + 0.004, state.anchor + cue.time), cue.slot, cue.number);
      }
      if (elapsed >= config.total) finish(); else render();
    }
    async function start() {
      const resuming = state.mode === 'paused';
      if (!resuming) { state.elapsed = 0; refreshSettings(true); }
      const token = ++state.token; ++previewToken; stopVoices();
      setText('notice', ''); state.mode = 'starting'; render();
      try {
        await unlockAudio();
        if (token !== state.token || state.mode !== 'starting') return;
        if (document.hidden) { state.mode = 'paused'; setText('notice', '页面已切到后台，点“继续这一组”开始。'); render(); return; }
        state.cues = buildCues();
        state.nextCue = resuming ? state.cues.findIndex(cue => cue.time >= state.elapsed - 0.000001) : 0;
        if (state.nextCue < 0) state.nextCue = state.cues.length;
        state.anchor = audio.currentTime + 0.06 - state.elapsed;
        state.mode = 'running';
        tick(); state.interval = setInterval(tick, 25); acquireWakeLock();
      } catch (error) {
        if (token !== state.token) return;
        state.mode = resuming ? 'paused' : 'idle'; setText('notice', error.message || '声音开启失败，请再点一次开始。'); render();
      }
    }
    function pause(message = '') {
      if (state.mode !== 'running' && state.mode !== 'starting') return;
      const elapsed = elapsedNow(); ++state.token; stopLoop(); stopVoices(); releaseWakeLock();
      state.elapsed = elapsed;
      if (elapsed >= config.total) { sound('finish', audio.currentTime + 0.01); finish(); return; }
      state.mode = 'paused'; setText('notice', message); render();
    }
    function reset() {
      ++state.token; ++previewToken; stopLoop(); stopVoices(); releaseWakeLock();
      state.mode = 'idle'; state.elapsed = 0; state.nextCue = 0;
      setText('notice', ''); refreshSettings(true);
    }
    function primary() { if (state.mode === 'running') pause(); else if (state.mode !== 'starting') start(); }
    fields.forEach(id => { $(id).addEventListener('input', () => refreshSettings()); $(id).addEventListener('change', () => refreshSettings(true)); });
    $('prep').addEventListener('change', () => refreshSettings());
    document.querySelectorAll('[data-input]').forEach(button => button.addEventListener('click', () => { const input = $(button.dataset.input), value = validNumber(input.id, defaults[input.id]); input.value = short(clamp(value + Number(button.dataset.step), Number(input.min), Number(input.max))); refreshSettings(true); }));
    document.querySelectorAll('.preset').forEach(button => button.addEventListener('click', () => { $('upSeconds').value = button.dataset.up; $('downSeconds').value = button.dataset.down; refreshSettings(true); }));
    document.querySelectorAll('.order-option').forEach(button => button.addEventListener('click', () => { selectedOrder = button.dataset.order; refreshSettings(true); }));
    $('volume').addEventListener('input', updateVolume);
    document.querySelectorAll('.sound-test').forEach(button => button.addEventListener('click', async () => {
      const token = ++previewToken; stopVoices(); setText('notice', '');
      try { await unlockAudio(); if (token === previewToken && ['idle', 'done'].includes(state.mode)) sound(button.dataset.sound, audio.currentTime + 0.015); } catch (error) { setText('notice', error.message); }
    }));
    $('primaryButton').addEventListener('click', primary); $('resetButton').addEventListener('click', reset);
    document.addEventListener('keydown', event => {
      if (event.altKey || event.ctrlKey || event.metaKey || event.repeat || event.target.closest('input, textarea, select, button, a, [contenteditable="true"]')) return;
      if (event.code === 'Space') { event.preventDefault(); primary(); }
      else if (event.key.toLowerCase() === 'r') { event.preventDefault(); reset(); }
    });
    document.addEventListener('visibilitychange', () => { if (document.hidden) pause('页面切到后台，训练已自动暂停。回到这里后点“继续这一组”。'); });
    window.addEventListener('pagehide', () => { pause(); releaseWakeLock(); });
    $('keepScreenOn').addEventListener('change', () => {
      try { localStorage.setItem('youjie-keep-screen-on', $('keepScreenOn').checked ? '1' : '0'); } catch (_) {}
      if ($('keepScreenOn').checked && state.mode === 'running') acquireWakeLock(); else releaseWakeLock();
    });
    if (nativeScreen) nativeScreen.addListener('appPaused', () => { pause('应用已切到后台，训练已暂停。回到这里后点“继续这一组”。'); releaseWakeLock(); }).catch(() => {});
    try { $('keepScreenOn').checked = localStorage.getItem('youjie-keep-screen-on') !== '0'; } catch (_) {}
    restoreSettings(); config = readConfig(true); updateVolume(); refreshSettings(true); releaseWakeLock();
  })();
  </script>
  <script src="app-layout.js" defer></script>
</body>
